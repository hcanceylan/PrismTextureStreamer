name: Build PrismTextureStreamer DLL

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Repo Kodlarını Çek
      uses: actions/checkout@v4

    - name: MSBuild Yolunu Ayarla
      uses: microsoft/setup-msbuild@v2

    - name: Projeyi Release/x64 Olarak Derle
      shell: cmd
      run: >
        msbuild PrismTextureStreamerFB.sln
        /p:Configuration=Release
        /p:Platform=x64
        /p:WindowsTargetPlatformVersion=10.0
        /p:LanguageStandard=stdcpp20
        /p:CppWinRTOptimize=true
        /p:AdditionalDependencies="WindowsApp.lib;runtimeobject.lib;onecore.lib;%%(AdditionalDependencies)"

    - name: Üretilen DLL Dosyasını Yükle (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: PrismTextureStreamerFB-DLL
        path: |
          **/Release/*.dll
          **/x64/Release/*.dll
